# Duplication (CPD) exclusions, owner decision 2026-10-16.
# spawn-run.ts is deliberately copied per bounded context: contexts may not
# import each other and there is no shared kernel package yet. Tests repeat
# fixtures by design. Both are still analysed for bugs and security issues;
# only the copy-paste detector skips them.
sonar.cpd.exclusions=**/spawn-run.ts,**/__tests__/**,**/*.test.ts
