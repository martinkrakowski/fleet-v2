# Rules for @hexagen-monaco/arch-linter
# Template: modular-monolith (flexible mode)

global_whitelist:
  - "@fleet/shared"
  - "@fleet/shared/**"

# Domain layers may not import npm packages (ADR-0054). Nothing is exempt by
# default — list an exception here only when the library IS the domain artifact,
# and say why:
#
# domain_package_allowlist:
#   - package: <bounded-context>
#     allowed_packages:
#       - some-library

test_double_rules:
  allowed_cross_package_imports: true

# Hostile-input freeze (HIB plan D-HIB4). arch-linter has no rule for this; it is enforced by
# the manifest-generated ESLint no-restricted-syntax ban (warn until HIB13) and by the CI count
# ratchet scripts/check-hostile-input-ratchet.mjs against hostile-input-baseline.json (fails on
# any increase). The `lint:arch` rule forbidding `unknown` on inbound ports lands with HIB13.
