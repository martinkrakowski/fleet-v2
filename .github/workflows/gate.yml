name: gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: corepack enable
        run: corepack enable
      - name: yarn install --immutable
        run: yarn install --immutable
      - name: yarn build
        run: yarn build
      - name: yarn typecheck
        run: yarn typecheck
      - name: yarn lint
        run: yarn lint
      - name: yarn lint:arch
        run: yarn lint:arch
      - name: yarn test
        run: yarn test
      - name: yarn sync:check
        run: yarn sync:check
      - name: ocm-run tests
        run: sh tests/ocm-run.test.sh
