name: gate

on:
  pull_request:
  push:
    branches:
      - main
  # Inert until a merge queue exists on main (plan A-R1, D21/D22); then the queue's run of the
  # merged result reports the same required check.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  # Only a superseded pull_request run is cancelled; push, merge_group and dispatch runs finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

# The ruleset on main requires the check named `gate`. It is the aggregate job at the bottom,
# which passes only when every job it needs succeeded. Renaming or dropping it blocks every PR.
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # ubuntu-latest has curl and nc: the ocm-run integration suite (a vitest test in
      # work-execution) must run, never silently skip. turbo.json declares it in the test task's
      # env, so strict env mode passes it through to vitest.
      OCM_IT_REQUIRE: "1"
      # Pull requests replay cache hits (lane speed plan D27/D29, switched on by the owner on 2026-10-29);
      # pushes to main still execute every task, so main stays a full run that also refreshes the cache.
      TURBO_FORCE: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      # Before setup-node, so its yarn cache lookup resolves Yarn 4 from packageManager.
      - name: corepack enable (cache lookup)
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: corepack enable
        run: corepack enable
      - name: turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-
      - name: yarn install --immutable
        run: yarn install --immutable
      - name: model-family fixture parity
        run: sh scripts/check-model-family-fixtures.sh
      - name: turbo env declarations (every env read is declared or reviewed)
        run: node scripts/check-turbo-env.mjs
      - name: yarn build
        run: yarn build
      - name: yarn typecheck
        run: yarn typecheck
      - name: yarn lint
        run: yarn lint
      - name: yarn lint:arch
        run: yarn lint:arch
      - name: yarn test
        run: yarn test

  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: corepack enable (cache lookup)
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: corepack enable
        run: corepack enable
      - name: yarn install --immutable --mode=skip-build
        run: yarn install --immutable --mode=skip-build
      # Lifecycle scripts are skipped here: sync:check needs only the installed hexagen package.
      # hexagen sync --check reads the manifest and the tracked sources, not build output:
      # it passes on a checkout with no dist/ (checked before the split, 2026-10-28).
      - name: yarn sync:check
        run: yarn sync:check

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Every shard reports, so one failure does not hide another's.
      fail-fast: false
      matrix:
        # The shard count is also the denominator below; change both together.
        shard: [1, 2, 3, 4]
    name: shell (${{ matrix.shard }}/4)
    steps:
      - uses: actions/checkout@v4
      - name: corepack enable (cache lookup)
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: corepack enable
        run: corepack enable
      # tests/hexagen-contract.test.sh runs the installed hexagen binaries; no lifecycle script is needed.
      - name: yarn install --immutable --mode=skip-build
        run: yarn install --immutable --mode=skip-build
      # Each shard runs the runner pin checks and every tests/*.test.sh whose index in the
      # bytewise-sorted list is (shard - 1) modulo 4.
      - name: shell tests (shard ${{ matrix.shard }} of 4)
        run: yarn test:bin --shard ${{ matrix.shard }}/4

  # Q1d: the end-to-end conductor job (production quality plan §4.1). A real
  # ssh hop to the same runner through a disposable sshd on a loopback high
  # port, a fake opencode server behind bin/ocm-run's tunnel, a gh stub and
  # scripted review verdicts; every PR runs it (plan D1). The suite is skipped
  # everywhere else unless FLEET_E2E_SSH=1 (tests/e2e/ssh-fixture.sh).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: corepack enable (cache lookup)
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: corepack enable
        run: corepack enable
      - name: yarn install --immutable --mode=skip-build
        run: yarn install --immutable --mode=skip-build
      - name: yarn build
        run: yarn build
      # The fixture starts sshd as the runner user on 127.0.0.1 and needs nc for its readiness check.
      - name: sshd and nc for the fixture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server netcat-openbsd >/dev/null
          command -v sshd && command -v nc
      - name: e2e shell fixture test
        run: FLEET_E2E_SSH=1 sh tests/e2e-ssh-fixture.test.sh
      - name: e2e conductor scenarios
        run: cd apps/cli && FLEET_E2E_SSH=1 npx vitest run src/__tests__/e2e/
        env:
          CI: 'true'

  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build-test, sync, shell, e2e]
    # Runs whatever the needed jobs did, and fails unless every one succeeded: a failed,
    # cancelled or skipped job (or matrix shard) is never a pass.
    if: ${{ always() }}
    steps:
      - name: every needed job succeeded
        env:
          BUILD_TEST: ${{ needs.build-test.result }}
          SYNC: ${{ needs.sync.result }}
          SHELL_SHARDS: ${{ needs.shell.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          status=0
          for pair in "build-test=$BUILD_TEST" "sync=$SYNC" "shell=$SHELL_SHARDS" "e2e=$E2E"; do
            job=${pair%%=*}
            result=${pair#*=}
            echo "$job: $result"
            if [ "$result" != "success" ]; then
              status=1
            fi
          done
          exit "$status"
