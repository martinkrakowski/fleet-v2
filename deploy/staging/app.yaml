apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-v2
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: fleet-v2
  template:
    metadata:
      labels:
        app: fleet-v2
    spec:
      containers:
        - name: web
          image: registry.midnight.lan/library/fleet-v2:latest
          command:
            - node
            - node_modules/next/dist/bin/next
            - start
            - apps/web
            - -H
            - 0.0.0.0
            - -p
            - "3000"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
        - name: api
          image: registry.midnight.lan/library/fleet-v2:latest
          env:
            - name: PORT
              value: "3001"
            - name: HOST
              value: 0.0.0.0
          ports:
            - name: api
              containerPort: 3001
          readinessProbe:
            tcpSocket:
              port: 3001
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: fleet-v2
spec:
  selector:
    app: fleet-v2
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fleet-v2
  annotations:
    cert-manager.io/cluster-issuer: midnight-ca
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    - host: fleet-v2.midnight.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fleet-v2
                port:
                  name: http
  tls:
    - hosts:
        - fleet-v2.midnight.lan
      secretName: fleet-v2-tls
