# SonarCloud automatic analysis settings.
#
# Automatic analysis reads only: sonar.sources, sonar.tests, sonar.inclusions,
# sonar.exclusions, sonar.test.inclusions, sonar.test.exclusions,
# sonar.sourceEncoding, sonar.cpd.exclusions (plus language-specific Python and
# C++ settings). Rules cannot be switched off here; that is the quality
# profile on the SonarCloud dashboard.

sonar.sourceEncoding=UTF-8

# Sources and tests both start at the repository root; the inclusion and
# exclusion patterns below decide which file is which, so a file is never
# indexed twice.
sonar.sources=.
sonar.tests=.

# Tests: colocated *.test.ts(x), __tests__ folders, the API's test folder and
# the shell tests. They are analysed with SonarCloud's test rules, not its
# production rules.
sonar.test.inclusions=**/__tests__/**,**/*.test.ts,**/*.test.tsx,apps/api/test/**,tests/**

# Not analysed as source: tests (above), build output, dependencies, generated
# lockfiles and documentation.
sonar.exclusions=**/__tests__/**,**/*.test.ts,**/*.test.tsx,apps/api/test/**,tests/**,**/dist/**,**/.output/**,**/.next/**,**/node_modules/**,**/coverage/**,yarn.lock,docs/**

# Duplication (CPD) exclusions, owner decisions 2026-10-16.
# spawn-run.ts is deliberately copied per bounded context: contexts may not
# import each other. The model-family function is kept byte-identical in two
# contexts (installation policy and the evidence ReviewReceipt) and pinned by a
# shared fixture table and a CI parity check. Tests repeat fixtures by design.
# All of these are still analysed for bugs and security issues; only the
# copy-paste detector skips them.
sonar.cpd.exclusions=**/spawn-run.ts,**/__tests__/**,**/*.test.ts,packages/installation/src/policy.ts,packages/evidence-and-acceptance/src/domain/entities/ReviewReceipt.ts
