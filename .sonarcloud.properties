# Duplication (CPD) exclusions, owner decision 2026-10-16.
# spawn-run.ts is deliberately copied per bounded context: contexts may not
# import each other and there is no shared kernel package yet. Tests repeat
# fixtures by design. Both are still analysed for bugs and security issues;
# only the copy-paste detector skips them. The model-family function is also kept
# byte-identical in two contexts (installation policy and the evidence ReviewReceipt)
# and pinned by a shared fixture table and a CI parity check (owner decision 2026-10-16).
sonar.cpd.exclusions=**/spawn-run.ts,**/__tests__/**,**/*.test.ts,packages/installation/src/policy.ts,packages/evidence-and-acceptance/src/domain/entities/ReviewReceipt.ts
