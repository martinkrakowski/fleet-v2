# gitleaks configuration: the default rules, plus narrow allowlists for known test fixtures and
# placeholders. Each entry requires the file AND the rule AND the fixture's line pattern
# (condition = "AND"), so any other finding in the same file is still caught. Add an entry only for a reviewed fixture, never for a real value.
title = "fleet-v2"

[extend]
useDefault = true

[[allowlists]]
description = "brief-knowledge redaction tests: an expired, unsigned JWT fixture"
condition = "AND"
targetRules = ["jwt"]
regexTarget = "line"
regexes = ['''JWT: \x27Expired eyJ''']
paths = ['''^packages/brief-knowledge/src/infrastructure/adapters/__tests__/git-shelf-provider\.test\.ts$''']
